name: Android Build & CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew scripts/verify-apk.sh

      # The release key lives in repository secrets and is never generated here.
      # Without it, Gradle falls back to the debug key (fine for CI builds, never
      # for distribution) and prints a warning.
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "ARENA_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "ARENA_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
              echo "ARENA_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              echo "ARENA_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release keystore restored from secrets."
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not configured. The release APK produced by this run is DEBUG-SIGNED and must not be distributed."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew test --stacktrace

      - name: Run lint (report only)
        working-directory: android
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Run architecture & security audit tests
        run: npm test

      - name: Audit npm dependencies (report only)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Build release and debug APKs
        working-directory: android
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Verify release APK signatures, alignment and metadata
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk artifacts-check.apk
          scripts/verify-apk.sh artifacts-check.apk

      - name: Compute checksums
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/ArenaAI.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/ArenaAI-debug.apk
          cd artifacts
          sha256sum ArenaAI.apk > SHA256SUMS
          sha256sum ArenaAI-debug.apk >> SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: arena-ai-apk
          path: artifacts/
          if-no-files-found: error
