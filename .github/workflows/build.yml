name: Android Build & CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Generate Community Release Keystore
        working-directory: android/app
        run: |
          keytool -genkey -v -keystore release.keystore -alias arenaai -keyalg RSA -keysize 2048 -validity 10000 -storepass arena1234 -keypass arena1234 -dname "CN=Arena Mobile Community, OU=Open Source, O=Community, L=San Francisco, ST=CA, C=US"

      - name: Run Unit Tests
        working-directory: android
        run: ./gradlew test --stacktrace

      - name: Build Release and Debug APKs
        working-directory: android
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Compute Checksums
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/ArenaAI.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/ArenaAI-debug.apk
          cd artifacts
          sha256sum ArenaAI.apk > SHA256SUMS
          sha256sum ArenaAI-debug.apk >> SHA256SUMS
          cat SHA256SUMS

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: arena-ai-apk
          path: artifacts/
