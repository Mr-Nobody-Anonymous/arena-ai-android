name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v1.0.4)"
        required: true
      dry_run:
        description: "Build and verify only — never publish or require the keystore"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA-256 of the documented release certificate. Publishing an APK signed with any
  # other key silently breaks every existing install, so the pipeline refuses to do it.
  EXPECTED_CERT_SHA256: "0A:78:95:E6:52:C7:F1:9C:58:8A:DD:1A:B8:40:B4:C5:EE:32:EA:C1:64:55:89:27:0F:34:65:05:99:D3:F2:DE"

jobs:
  release:
    name: Build, verify and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Require the protected release keystore
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ] || [ -z "${RELEASE_STORE_PASSWORD:-}" ] \
             || [ -z "${RELEASE_KEY_ALIAS:-}" ] || [ -z "${RELEASE_KEY_PASSWORD:-}" ]; then
            echo "::error::Release signing secrets are not configured. Refusing to publish a debug-signed APK. See RELEASE.md."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "ARENA_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "ARENA_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "ARENA_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "ARENA_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Verify tag matches the Gradle version
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          GRADLE_VERSION=$(grep -E "versionName \"" android/app/build.gradle | head -1 | sed -E 's/.*versionName "([^"]+)".*/\1/')
          TAG_VERSION="${TAG_NAME#v}"
          echo "Gradle version: $GRADLE_VERSION / tag version: $TAG_VERSION"
          if [ "$GRADLE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_NAME does not match versionName $GRADLE_VERSION in android/app/build.gradle."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run audit tests
        run: npm test

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew test assembleRelease --stacktrace

      - name: Verify signatures, alignment and metadata
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk artifacts-check.apk
          chmod +x scripts/verify-apk.sh
          scripts/verify-apk.sh artifacts-check.apk
          # Fail loudly if the APK was signed with the CI fallback debug key.
          if ! unzip -p artifacts-check.apk META-INF/CERT.RSA >/dev/null 2>&1; then
            echo "::error::No v1 signing certificate found in the release APK."
            exit 1
          fi

      - name: Verify the APK uses the documented release certificate
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          CERT=$(apksigner verify --print-certs artifacts-check.apk \
                 | grep -m1 -i "certificate SHA-256 digest" \
                 | sed -E 's/.*digest:[[:space:]]*//')
          echo "APK certificate: $CERT"
          echo "Expected       : $EXPECTED_CERT_SHA256"
          if [ "$(echo "$CERT" | tr '[:lower:]' '[:upper:]')" != "$(echo "$EXPECTED_CERT_SHA256" | tr '[:lower:]' '[:upper:]')" ]; then
            echo "::error::The release APK is not signed with the documented key. Existing installs would reject this update. See RELEASE.md → 'If the signing key is lost'."
            exit 1
          fi

      - name: Prepare release assets
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/ArenaAI.apk
          cd artifacts
          sha256sum ArenaAI.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" artifacts/ArenaAI.apk artifacts/SHA256SUMS --clobber
            gh release edit "$TAG_NAME" --notes-file release_notes.md
          else
            gh release create "$TAG_NAME" \
              artifacts/ArenaAI.apk \
              artifacts/SHA256SUMS \
              --title "Arena.ai Android Client $TAG_NAME" \
              --notes-file release_notes.md
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: arena-ai-release-apk
          path: artifacts/
          if-no-files-found: error

      - name: Dry-run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          {
            echo "### Dry run — nothing was published"
            echo ""
            echo "The APK above was built **without** the release keystore (debug key)."
            echo "Re-run without \`dry_run\` once the \`release\` environment secrets exist."
          } >> "$GITHUB_STEP_SUMMARY"
