plugins {
    id 'com.android.application'
}

/*
 * Release signing.
 *
 * The keystore is NEVER generated by CI and never committed. Provide it through
 * Gradle properties or environment variables:
 *
 *   ARENA_RELEASE_STORE_FILE      absolute path to the .jks/.keystore
 *   ARENA_RELEASE_STORE_PASSWORD
 *   ARENA_RELEASE_KEY_ALIAS
 *   ARENA_RELEASE_KEY_PASSWORD
 *
 * When they are absent (local builds, pull requests from forks) the release build
 * falls back to the debug key and prints a warning. Such an APK must not be
 * distributed: Android will refuse to install it over a properly signed build.
 */
def releaseStorePath = project.findProperty('ARENA_RELEASE_STORE_FILE')
        ?: System.getenv('ARENA_RELEASE_STORE_FILE')
def releaseStorePassword = project.findProperty('ARENA_RELEASE_STORE_PASSWORD')
        ?: System.getenv('ARENA_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('ARENA_RELEASE_KEY_ALIAS')
        ?: System.getenv('ARENA_RELEASE_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('ARENA_RELEASE_KEY_PASSWORD')
        ?: System.getenv('ARENA_RELEASE_KEY_PASSWORD')

def releaseKeystoreFile = releaseStorePath ? file(releaseStorePath) : null
def hasReleaseSigning = releaseKeystoreFile != null
        && releaseKeystoreFile.exists()
        && releaseStorePassword
        && releaseKeyAlias
        && releaseKeyPassword

if (!hasReleaseSigning) {
    logger.warn('====================================================================')
    logger.warn(' ARENA_RELEASE_STORE_FILE / password / alias are not configured.')
    logger.warn(' Release builds will be DEBUG-SIGNED and must not be distributed.')
    logger.warn('====================================================================')
}

android {
    namespace 'ai.arena.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "ai.arena.mobile"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.0.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
            // v1 + v2 + v3 covers Android 8.0 through Android 15+ and protects
            // against the Janus vulnerability.
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Debug builds keep the standard, throwaway Android debug key.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.4.21") {
            because("kotlin-stdlib-jdk7 is now merged into kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.21") {
            because("kotlin-stdlib-jdk8 is now merged into kotlin-stdlib")
        }
    }

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.activity:activity:1.8.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
