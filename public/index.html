<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arena.ai">
  <meta name="description" content="The official Arena.ai live web platform optimized for Android">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Arena AI: The Official AI Ranking & LLM Leaderboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 100% Full-Screen Live Arena Web Frame */
    #arena-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 10;
      background: #000000;
      transition: opacity 0.3s ease;
    }

    /* Loading Overlay while the live site loads */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #0a0f1d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      transition: opacity 0.4s ease, visibility 0.4s;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #1e293b;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-title {
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .loader-sub {
      font-size: 0.82rem;
      color: #94a3b8;
    }

    /* Floating Android Control Dock (Material 3 Pill) */
    #android-dock {
      position: fixed;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 36px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      max-width: 96vw;
    }

    #android-dock.minimized {
      transform: translateX(-50%) translateY(75px);
      opacity: 0;
      pointer-events: none;
    }

    /* Trigger button to restore minimized dock */
    #dock-restore-btn {
      position: fixed;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      right: 14px;
      z-index: 99;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e2e8f0;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    #dock-restore-btn.visible {
      display: flex;
    }

    .dock-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      min-height: 38px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .dock-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.1);
    }

    .dock-btn.active {
      background: #4f46e5;
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(79, 70, 229, 0.4);
    }

    .dock-divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 2px;
    }

    /* Latency Status Pill */
    .ping-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #10b981;
      padding: 4px 8px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.12);
    }

    .ping-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    /* Android Install Banner */
    #install-banner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 110;
      background: linear-gradient(90deg, #312e81, #1e1b4b);
      border-bottom: 1px solid #4f46e5;
      padding: 10px 16px;
      align-items: center;
      justify-content: space-between;
      color: white;
      font-size: 0.85rem;
    }

    #install-banner.visible {
      display: flex;
    }

    .btn-install {
      background: #6366f1;
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* QR Code & Sharing Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #131c31;
      border: 1px solid #334155;
      border-radius: 20px;
      max-width: 400px;
      width: 100%;
      padding: 24px;
      text-align: center;
      color: #f8fafc;
    }

    .qr-img {
      width: 220px;
      height: 220px;
      margin: 16px auto;
      border-radius: 12px;
      background: white;
      padding: 8px;
    }

    .btn-close-modal {
      background: #334155;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Loading State -->
  <div id="loading-screen">
    <div class="loader-spinner"></div>
    <div class="loader-title">Loading Arena.ai...</div>
    <div class="loader-sub">Streaming live platform directly from the web</div>
  </div>

  <!-- PWA Install Banner -->
  <div id="install-banner">
    <div>
      <strong>Install Arena.ai on Android</strong>
      <div style="font-size: 0.72rem; color: #cbd5e1;">Tap to install standalone fullscreen app</div>
    </div>
    <button class="btn-install" id="btn-install-act">Install</button>
  </div>

  <!-- 100% Full-Screen Live Arena Website Frame -->
  <iframe
    id="arena-frame"
    src="/arena/"
    title="Arena.ai Live Platform"
    allow="clipboard-write; clipboard-read; camera; microphone; geolocation"
    sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-downloads">
  </iframe>

  <!-- Floating Android Control Dock -->
  <div id="android-dock">
    <button class="dock-btn active" id="btn-mode-arena" data-url="/arena/">
      <span>⚔️</span> <span>Arena</span>
    </button>
    <button class="dock-btn" id="btn-mode-leaderboard" data-url="/arena/leaderboard">
      <span>🏆</span> <span>Rankings</span>
    </button>
    <button class="dock-btn" id="btn-mode-direct" data-url="/arena/?mode=direct">
      <span>💬</span> <span>Direct</span>
    </button>
    <button class="dock-btn" id="btn-mode-vision" data-url="/arena/?mode=vision">
      <span>👁️</span> <span>Vision</span>
    </button>

    <div class="dock-divider"></div>

    <button class="dock-btn" id="btn-reload-frame" title="Reload Page">
      <span>🔄</span>
    </button>
    <button class="dock-btn" id="btn-open-qr" title="Share with Android Phone">
      <span>📱</span>
    </button>

    <div class="ping-pill" id="ping-display" title="Live ping to arena.ai">
      <span class="ping-dot"></span>
      <span id="ping-text">-- ms</span>
    </div>

    <button class="dock-btn" id="btn-minimize-dock" title="Hide Dock for Fullscreen" style="padding: 6px 8px;">
      <span>✕</span>
    </button>
  </div>

  <!-- Floating Button to restore minimized dock -->
  <button id="dock-restore-btn" title="Open Navigation Tools">⚡</button>

  <!-- QR Code Connect Modal -->
  <div class="modal-overlay" id="qr-modal">
    <div class="modal-card">
      <h3 style="margin-bottom: 6px;">📱 Connect Android Phone</h3>
      <p style="font-size: 0.8rem; color: #94a3b8;">
        Scan this QR code with your Android camera or Chrome browser:
      </p>

      <img id="qr-code-img" class="qr-img" src="/api/qr" alt="QR Code">

      <div style="background: #0f172a; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; color: #38bdf8; word-break: break-all; margin-bottom: 12px;" id="qr-url-text">
        Loading URL...
      </div>

      <button class="btn-close-modal" id="btn-copy-url" style="background: #4f46e5; margin-bottom: 8px;">📋 Copy Link</button>
      <button class="btn-close-modal" id="btn-close-qr">Close</button>
    </div>
  </div>

  <script>
    const frame = document.getElementById('arena-frame');
    const loadingScreen = document.getElementById('loading-screen');
    const dock = document.getElementById('android-dock');
    const restoreBtn = document.getElementById('dock-restore-btn');
    const pingText = document.getElementById('ping-text');
    let deferredInstallPrompt = null;

    // --- PWA Service Worker Registration ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('PWA ServiceWorker registered:', reg.scope))
          .catch(err => console.warn('PWA registration failed:', err));
      });
    }

    // --- Android PWA Installation Event ---
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const banner = document.getElementById('install-banner');
      if (banner) banner.classList.add('visible');
    });

    document.getElementById('btn-install-act').addEventListener('click', async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        const { outcome } = await deferredInstallPrompt.userChoice;
        console.log('User response to install:', outcome);
        deferredInstallPrompt = null;
        document.getElementById('install-banner').classList.remove('visible');
      } else {
        alert('To install on Android:\n1. Tap the three dots (⋮) in Chrome\n2. Select "Add to Home screen" or "Install App"');
      }
    });

    // --- Frame Loading State ---
    frame.addEventListener('load', () => {
      setTimeout(() => {
        loadingScreen.classList.add('hidden');
      }, 500);
    });

    // Safety timeout in case load event fires slowly
    setTimeout(() => {
      loadingScreen.classList.add('hidden');
    }, 4000);

    // --- Navigation Dock Buttons ---
    const navButtons = [
      document.getElementById('btn-mode-arena'),
      document.getElementById('btn-mode-leaderboard'),
      document.getElementById('btn-mode-direct'),
      document.getElementById('btn-mode-vision')
    ];

    navButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        navButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const targetUrl = btn.getAttribute('data-url');
        loadingScreen.classList.remove('hidden');
        frame.src = targetUrl;
      });
    });

    // Reload Button
    document.getElementById('btn-reload-frame').addEventListener('click', () => {
      loadingScreen.classList.remove('hidden');
      frame.src = frame.src;
    });

    // Minimize & Restore Dock
    document.getElementById('btn-minimize-dock').addEventListener('click', () => {
      dock.classList.add('minimized');
      restoreBtn.classList.add('visible');
    });

    restoreBtn.addEventListener('click', () => {
      dock.classList.remove('minimized');
      restoreBtn.classList.remove('visible');
    });

    // --- QR Modal ---
    const qrModal = document.getElementById('qr-modal');
    document.getElementById('btn-open-qr').addEventListener('click', async () => {
      qrModal.classList.add('active');
      try {
        const res = await fetch('/api/network-info');
        const data = await res.json();
        document.getElementById('qr-url-text').textContent = data.mobileUrl;
        if (data.qrDataUrl) {
          document.getElementById('qr-code-img').src = data.qrDataUrl;
        }
      } catch (e) {
        document.getElementById('qr-url-text').textContent = window.location.origin;
      }
    });

    document.getElementById('btn-close-qr').addEventListener('click', () => {
      qrModal.classList.remove('active');
    });

    document.getElementById('btn-copy-url').addEventListener('click', () => {
      const url = document.getElementById('qr-url-text').textContent;
      navigator.clipboard.writeText(url).then(() => {
        alert('URL copied to clipboard: ' + url);
      });
    });

    qrModal.addEventListener('click', (e) => {
      if (e.target === qrModal) qrModal.classList.remove('active');
    });

    // --- Periodic Live Latency Ping ---
    async function updatePing() {
      try {
        const res = await fetch('/api/arena-status');
        const data = await res.json();
        if (data.online && typeof data.latencyMs === 'number') {
          pingText.textContent = `${data.latencyMs} ms`;
        } else {
          pingText.textContent = 'Live';
        }
      } catch (_) {
        pingText.textContent = 'Ready';
      }
    }

    updatePing();
    setInterval(updatePing, 15000);
  </script>
</body>
</html>
